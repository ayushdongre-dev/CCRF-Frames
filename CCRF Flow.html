<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equall · CCRF Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --primary: #7F55DF;
      --primary-d: #6B40CF;
      --primary-l: #EFEEFE;
      --ink: #1B192E;
      --ink-2: #4B4960;
      --muted: #8A879B;
      --line: #ECEAF4;
      --bg: #F4F3FB;
      --green: #1FA971;
      --green-l: #E7F7EF;
      --red: #D44F48;
      --red-l: #FBECEB;
      --teal: #20BFB4;
      --ccrf-rate: 22;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #E7E5F0;
      font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--ink);
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .scr {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(.8);
      }

      60% {
        transform: scale(1.06);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes pulseGlow {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 4px 10px rgba(91, 63, 212, 0.25);
      }

      50% {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(91, 63, 212, 0.45);
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    @keyframes cardStampPop {
      0% {
        transform: scale(2.5) rotate(-15deg);
        opacity: 0;
      }

      55% {
        transform: scale(0.88) rotate(-8deg);
        opacity: 1;
      }

      75% {
        transform: scale(1.06) rotate(-10deg);
      }

      100% {
        transform: scale(1) rotate(-10deg);
        opacity: 1;
      }
    }

    @keyframes dotTravel {
      0% {
        transform: translateX(0) scale(0.4);
        opacity: 0;
      }

      10% {
        transform: translateX(0) scale(1);
        opacity: 1;
      }

      90% {
        transform: translateX(152px) scale(1);
        opacity: 1;
      }

      100% {
        transform: translateX(152px) scale(0.4);
        opacity: 0;
      }
    }

    @keyframes pendingPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(1.06);
      }
    }

    @keyframes drawCheck {
      0% {
        stroke-dashoffset: 24;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes gentleFloat {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      25% {
        transform: translateY(-8px) rotate(2deg);
      }

      75% {
        transform: translateY(4px) rotate(-1deg);
      }
    }

    @keyframes successGlow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(5, 150, 105, .2);
      }

      50% {
        box-shadow: 0 0 40px rgba(5, 150, 105, .4);
      }
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg) scale(0);
        opacity: 0;
      }

      15% {
        opacity: 1;
        transform: translateY(0) rotate(45deg) scale(1);
      }

      100% {
        transform: translateY(60px) rotate(360deg) scale(0);
        opacity: 0;
      }
    }

    @keyframes lockShimmer {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 0.75;
      }
    }

    @keyframes progressFill {
      from {
        height: 0;
      }

      to {
        height: 100%;
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(.97);
        max-height: 0;
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        max-height: 600px;
      }
    }

    @keyframes pulseRing {
      0% {
        transform: scale(1);
        opacity: .5;
      }

      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    @keyframes lineGrow {
      from {
        transform: scaleY(0);
      }

      to {
        transform: scaleY(1);
      }
    }

    @keyframes nodePulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes nodePulseGentle {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }
    }

    @keyframes glowFadeGreen {
      0% {
        box-shadow: 0 2px 12px -4px rgba(31, 169, 113, .12);
      }

      35% {
        box-shadow: 0 4px 28px -4px rgba(31, 169, 113, .48), 0 0 0 3px rgba(31, 169, 113, .1);
      }

      100% {
        box-shadow: 0 2px 12px -4px rgba(31, 169, 113, .12);
      }
    }

    @keyframes lockShake {
      0% {
        transform: translateX(0) rotate(0deg);
      }

      18% {
        transform: translateX(-3px) rotate(-5deg);
      }

      36% {
        transform: translateX(3px) rotate(4deg);
      }

      54% {
        transform: translateX(-2px) rotate(-2deg);
      }

      72% {
        transform: translateX(2px) rotate(1deg);
      }

      88% {
        transform: translateX(-1px);
      }

      100% {
        transform: translateX(0) rotate(0deg);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes barFillH {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }
  </style>
</head>

<body>
  <div id="stage"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"

</body>

</html>
