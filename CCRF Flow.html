<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Equall · CCRF Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary:#7F55DF;
    --primary-d:#6B40CF;
    --primary-l:#EFEEFE;
    --ink:#1B192E;
    --ink-2:#4B4960;
    --muted:#8A879B;
    --line:#ECEAF4;
    --bg:#F4F3FB;
    --green:#1FA971;
    --green-l:#E7F7EF;
    --red:#D44F48;
    --red-l:#FBECEB;
    --teal:#20BFB4;
    --ccrf-rate:22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#E7E5F0;
    font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:var(--ink);
    overflow:hidden;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  ::-webkit-scrollbar{width:0;height:0;}
  .scr{scrollbar-width:none;-ms-overflow-style:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{0%{opacity:0;transform:scale(.8);}60%{transform:scale(1.06);}100%{opacity:1;transform:scale(1);}}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes float{0%, 100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
</style>
</head>
<body>
  <div id="stage"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="frames/tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/shared.jsx"></script>
  <script type="text/babel" src="app/screen-home.jsx"></script>
  <script type="text/babel" src="app/screen-multioffer.jsx"></script>
  <script type="text/babel" src="app/screen-selling.jsx?v=18"></script>
  <script type="text/babel" src="app/screen-cards.jsx"></script>
  <script type="text/babel" src="app/screen-eligibility.jsx?v=4"></script>
  <script type="text/babel" src="app/screen-visualise.jsx?v=2"></script>
  <script type="text/babel" src="app/screen-pdf.jsx?v=2"></script>
  <script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
